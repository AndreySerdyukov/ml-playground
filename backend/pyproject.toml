[project]
name = "ml-serving-backend"
version = "0.1.0"
description = "Шаблон backend-сервиса ML-инференса (FastAPI, слоистая архитектура)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Загрузка файлов (multipart) + чтение .xlsx для батч-предикта.
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "joblib>=1.4",
    # Пин минорной версии: обученный cars.joblib пиклится sklearn'ом и должен
    # распаковываться той же минорной версией в рантайме (иначе ломается pickle).
    "scikit-learn~=1.9.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# У sklearn/joblib/pandas нет type-стабов – не считаем это ошибкой при strict.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "pandas"]
ignore_missing_imports = true
