[project]
name = "ml-serving-backend"
version = "0.1.0"
description = "Template for an ML inference backend service (FastAPI, layered architecture)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # File uploads (multipart) + reading .xlsx for batch predict.
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "joblib>=1.4",
    # Pin the minor version: the trained cars.joblib is pickled by sklearn and must
    # be unpickled by the same minor version at runtime (otherwise the pickle breaks).
    "scikit-learn~=1.9.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# sklearn/joblib/pandas have no type stubs - don't treat this as an error under strict.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "pandas"]
ignore_missing_imports = true
