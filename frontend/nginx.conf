server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve anything unknown from index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API to the backend service (name from docker-compose).
    location /api/ {
        # Match the backend's MAX_UPLOAD_BYTES (10 MB) so batch uploads are not cut off by the
        # nginx default (1 MB) before they reach the app.
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend:8000;
    }
}
